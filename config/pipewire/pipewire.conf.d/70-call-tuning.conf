# Call tuning for HP laptop (Realtek ALC285) built-in mic + speakers.
#
# Mic:      raw mic -> Echo-Cancelled Mic (60-echo-cancel.conf) -> Call Mic (this EQ)
# Speakers: apps -> Echo-Cancel Speakers -> Call Speakers EQ (this) -> hardware
context.modules = [
    # ---------- Microphone voice EQ ----------
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "HD VOICE"
            media.name       = "HD VOICE"
            filter.graph = {
                nodes = [
                    # remove desk thumps, fan rumble, breath pops
                    { type = builtin label = bq_highpass name = hp     control = { "Freq" = 100.0  "Q" = 0.707 } }
                    # laptop-chassis boxiness
                    { type = builtin label = bq_peaking  name = box    control = { "Freq" = 300.0  "Q" = 1.0 "Gain" = -3.0 } }
                    # presence / intelligibility
                    { type = builtin label = bq_peaking  name = pres   control = { "Freq" = 3000.0 "Q" = 0.9 "Gain" = 3.0 } }
                    # trim hiss above the useful voice band
                    { type = builtin label = bq_lowpass  name = lp     control = { "Freq" = 12000.0 "Q" = 0.707 } }
                # compressor: evens out soft vs loud speech
                { type = ladspa plugin = sc4m_1916 label = sc4m name = comp
                  control = {
                      "RMS/peak"            = 0.3
                      "Attack time (ms)"    = 10.0
                      "Release time (ms)"   = 150.0
                      "Threshold level (dB)" = -24.0
                      "Ratio (1:n)"         = 3.0
                      "Knee radius (dB)"    = 6.0
                      "Makeup gain (dB)"    = 8.0
                  } }
                # limiter: hard ceiling at -1 dB so loud moments never distort
                { type = ladspa plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter name = lim
                  control = {
                      "Input gain (dB)"  = 0.0
                      "Limit (dB)"       = -1.0
                      "Release time (s)" = 0.05
                  } }
                ]
                links = [
                    { output = "hp:Out"   input = "box:In" }
                    { output = "box:Out"  input = "pres:In" }
                    { output = "pres:Out" input = "lp:In" }
                    { output = "lp:Out"   input = "comp:Input" }
                    { output = "comp:Output" input = "lim:Input 1" }
                ]
                inputs  = [ "hp:In" ]
                outputs = [ "lim:Output 1" ]
            }
            capture.props = {
                node.name      = "capture.call-mic"
                node.passive   = true
                target.object  = "echo-cancel-source"
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name        = "call-mic"
                node.description = "HD VOICE"
                media.class      = Audio/Source
                audio.channels   = 1
                audio.position   = [ MONO ]
            }
        }
    }

    # ---------- Laptop speaker EQ for voices ----------
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "HD SPEAKER (internal EQ, do not select)"
            media.name       = "HD SPEAKER EQ"
            filter.graph = {
                nodes = [
                    # laptop speakers can't play deep bass; cutting it removes distortion
                    { type = builtin label = bq_highpass name = hp    control = { "Freq" = 140.0  "Q" = 0.707 } }
                    # reduce muddiness
                    { type = builtin label = bq_peaking  name = mud   control = { "Freq" = 400.0  "Q" = 1.0 "Gain" = -2.5 } }
                    # voice clarity
                    { type = builtin label = bq_peaking  name = voice control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
                    # tame harsh highs from tiny drivers
                    { type = builtin label = bq_highshelf name = air  control = { "Freq" = 9000.0 "Q" = 0.707 "Gain" = -1.5 } }
                    # headroom so the boosts don't clip (-2 dB)
                    { type = builtin label = linear      name = gain  control = { "Mult" = 0.8 "Add" = 0.0 } }
                ]
                links = [
                    { output = "hp:Out"    input = "mud:In" }
                    { output = "mud:Out"   input = "voice:In" }
                    { output = "voice:Out" input = "air:In" }
                    { output = "air:Out"   input = "gain:In" }
                ]
            }
            capture.props = {
                node.name      = "call-speakers-eq"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "playback.call-speakers-eq"
                node.passive   = true
                target.object  = "alsa_output.pci-0000_04_00.6.analog-stereo"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
