# WebRTC echo cancellation for the laptop mic.
# Apps must play to "Echo-Cancel Speakers" (set as default sink) so the
# canceller gets a sample-accurate reference of what the speakers play.
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 480/48000
            aec.args = {
                webrtc.high_pass_filter  = true
                webrtc.noise_suppression = true
                webrtc.gain_control      = false
                webrtc.extended_filter   = true
                webrtc.delay_agnostic    = true
            }
            capture.props = {
                node.name    = "capture.echo-cancel"
                node.passive = true
                target.object = "alsa_input.pci-0000_04_00.6.analog-stereo"
            }
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "HD VOICE (internal, do not select)"
                audio.channels   = 1
                audio.position   = [ MONO ]
            }
            sink.props = {
                node.name        = "echo-cancel-sink"
                node.description = "HD SPEAKER"
            }
            playback.props = {
                node.name    = "playback.echo-cancel"
                node.passive = true
                target.object = "call-speakers-eq"
            }
        }
    }
]
